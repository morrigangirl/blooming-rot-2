name: Build & publish Foundry release

# Fires when a version tag is pushed (git push origin v1.4.4).
# Rebuilds the compendium packs from source, builds dist/module.json +
# dist/module.zip, and creates the GitHub Release that Foundry's
# releases/latest/download/module.json manifest URL resolves to.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install build tooling
        run: npm ci

      - name: Verify tag matches module.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match module.json version $VERSION"
            exit 1
          fi

      - name: Rebuild compendium packs from source
        run: npm run build:packs

      - name: Build release artifacts
        run: npm run build:release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Blooming Rot 2 ${{ github.ref_name }}"
          files: |
            dist/module.json
            dist/module.zip
          generate_release_notes: true
